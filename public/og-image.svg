<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(201,168,76,0.08)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Gold left accent bar -->
  <rect x="0" y="150" width="4" height="330" rx="2" fill="url(#barGrad)"/>
  <!-- Logo block -->
  <rect x="80" y="80" width="90" height="90" rx="20" fill="url(#logoGrad)" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <text x="125" y="143" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="38" fill="url(#textGrad)" letter-spacing="2">CL</text>
  <!-- Firm Name -->
  <text x="80" y="240" font-family="Georgia, serif" font-weight="700" font-size="68" fill="white" letter-spacing="-1">Costa Luis &amp; Co</text>
  <!-- Subtitle -->
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="32" fill="#C9A84C" letter-spacing="4">CHARTERED ACCOUNTANTS</text>
  <!-- Divider line -->
  <rect x="80" y="330" width="200" height="2" rx="1" fill="url(#divGrad)"/>
  <!-- Tagline -->
  <text x="80" y="385" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.75)">35+ Years of Trusted Audit, Tax &amp; Advisory Services</text>
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.6)">Nairobi CBD, Kenya · Est. 1991</text>
  <!-- Trust badges -->
  <rect x="80" y="480" width="180" height="40" rx="8" fill="rgba(201,168,76,0.12)" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <text x="170" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">ICPAK Registered</text>
  <rect x="278" y="480" width="240" height="40" rx="8" fill="rgba(201,168,76,0.12)" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <text x="398" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Licensed Insolvency Practitioner</text>
  <rect x="536" y="480" width="195" height="40" rx="8" fill="rgba(201,168,76,0.12)" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <text x="633" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">KASNEB Certified</text>
  <!-- Decorative circle -->
  <circle cx="1050" cy="315" r="280" fill="rgba(201,168,76,0.04)" stroke="rgba(201,168,76,0.08)" stroke-width="1"/>
  <circle cx="1050" cy="315" r="180" fill="rgba(27,58,107,0.15)" stroke="rgba(201,168,76,0.12)" stroke-width="1"/>
  <circle cx="1050" cy="315" r="90" fill="rgba(27,58,107,0.25)" stroke="rgba(201,168,76,0.2)" stroke-width="1.5"/>
  <text x="1050" y="325" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="52" fill="url(#textGrad2)" letter-spacing="3">CL</text>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1023"/>
      <stop offset="0.5" stop-color="#0F2444"/>
      <stop offset="1" stop-color="#1B3A6B"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="80" y1="80" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F2444"/>
      <stop offset="1" stop-color="#1B3A6B"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="150" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="transparent"/>
      <stop offset="0.3" stop-color="#C9A84C"/>
      <stop offset="0.7" stop-color="#E8C97A"/>
      <stop offset="1" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="divGrad" x1="80" y1="332" x2="280" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9A84C"/>
      <stop offset="1" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="90" y1="110" x2="165" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C97A"/>
      <stop offset="1" stop-color="#C9A84C"/>
    </linearGradient>
    <linearGradient id="textGrad2" x1="1000" y1="280" x2="1100" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C97A" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#C9A84C" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
</svg>
